{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Student Directory</h2>
    <form class="d-flex" method="GET" action="{{ url_for('view_students') }}">
        <input class="form-control me-2" type="search" name="search" value="{{ search }}" placeholder="Search Name or Roll">
        <button class="btn btn-outline-primary" type="submit">Search</button>
    </form>
</div>
<div class="table-responsive shadow bg-white">
    <table class="table table-hover mb-0">
        <thead class="table-dark">
            <tr>
                <th>Roll No</th>
                <th>Name</th>
                <th>Course</th>
                <th>Year</th>
                <th>Phone</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for s in students %}
            <tr>
                <td>{{ s.roll_no }}</td>
                <td>{{ s.name }}</td>
                <td>{{ s.course }}</td>
                <td>{{ s.year }}</td>
                <td>{{ s.phone }}</td>
                <td>
                    <a href="{{ url_for('edit_student', id=s.id) }}" class="btn btn-sm btn-warning">Edit</a>
                    <form action="{{ url_for('delete_student', id=s.id) }}" method="POST" style="display:inline;">
                        <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Delete this student?');">Delete</button>
                    </form>
                </td>
            </tr>
            {% else %}
            <tr><td colspan="6" class="text-center">No students found.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
