{% extends 'base.html' %}
{% block content %}
<h2>Edit Student</h2>
<div class="card shadow p-4 mt-3">
    <form method="POST" action="{{ url_for('edit_student', id=student.id) }}">
        <div class="row mb-3">
            <div class="col-md-6">
                <label>Name</label>
                <input type="text" name="name" class="form-control" value="{{ student.name }}" required>
            </div>
            <div class="col-md-6">
                <label>Roll Number</label>
                <input type="text" name="roll_no" class="form-control" value="{{ student.roll_no }}" required>
            </div>
        </div>
        <div class="row mb-3">
            <div class="col-md-6">
                <label>Email</label>
                <input type="email" name="email" class="form-control" value="{{ student.email }}" required>
            </div>
            <div class="col-md-6">
                <label>Phone</label>
                <input type="text" name="phone" class="form-control" value="{{ student.phone }}" required>
            </div>
        </div>
        <div class="row mb-3">
            <div class="col-md-4">
                <label>Course</label>
                <input type="text" name="course" class="form-control" value="{{ student.course }}" required>
            </div>
            <div class="col-md-4">
                <label>Year</label>
                <select name="year" class="form-select">
                    <option value="1st Year" {% if student.year == '1st Year' %}selected{% endif %}>1st Year</option>
                    <option value="2nd Year" {% if student.year == '2nd Year' %}selected{% endif %}>2nd Year</option>
                    <option value="3rd Year" {% if student.year == '3rd Year' %}selected{% endif %}>3rd Year</option>
                    <option value="4th Year" {% if student.year == '4th Year' %}selected{% endif %}>4th Year</option>
                </select>
            </div>
            <div class="col-md-4">
                <label>Admission Date</label>
                <input type="date" name="admission_date" class="form-control" value="{{ student.admission_date }}" required>
            </div>
        </div>
        <button type="submit" class="btn btn-primary">Update Student</button>
        <a href="{{ url_for('view_students') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
